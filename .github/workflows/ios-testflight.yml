name: Mataheko iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Mataheko iOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          architecture: x64
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install --repo-update

      - name: Import Apple Distribution Certificate
        env:
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"

          echo "$APPLE_DISTRIBUTION_P12" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "" \
            "$RUNNER_TEMP/build.keychain-db"

          security default-keychain \
            -s "$RUNNER_TEMP/build.keychain-db"

          security unlock-keychain \
            -p "" \
            "$RUNNER_TEMP/build.keychain-db"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_DISTRIBUTION_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$RUNNER_TEMP/build.keychain-db"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "" \
            "$RUNNER_TEMP/build.keychain-db"

          security list-keychains \
            -d user \
            -s "$RUNNER_TEMP/build.keychain-db"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/Mataheko_App.mobileprovision"

          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/Mataheko_App.mobileprovision"

      - name: Verify signing assets
        run: |
          echo "=== Signing identities ==="
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

          echo ""
          echo "=== Provisioning profiles ==="
          security cms \
            -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/Mataheko_App.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :UUID" \
            "$RUNNER_TEMP/profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:application-identifier" \
            "$RUNNER_TEMP/profile.plist"

      - name: Force dependency targets to Automatic signing
        run: |
          set -e

          echo "Removing accidental provisioning-profile settings from dependency projects..."

          find ios/Pods -name "*.pbxproj" -type f -print0 | while IFS= read -r -d '' file
          do
            sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$file"
            sed -i '' '/PROVISIONING_PROFILE/d' "$file"
          done

          echo "Dependency signing settings cleaned."

      - name: Verify Runner signing configuration
        run: |
          echo "=== Runner Release signing configuration ==="

          grep -A25 \
            '97C147071CF9000F007C117D /\* Release \*/' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Build signed IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mataheko-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: mataheko-ios-archive
          path: build/ios/archive/*.xcarchive
          retention-days: 7
