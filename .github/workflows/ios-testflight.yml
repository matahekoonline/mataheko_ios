name: Mataheko iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build and Sign Mataheko iOS
    runs-on: macos-26

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Flutter
      # ---------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          architecture: arm64
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      # ---------------------------------------------------------
      # 3. Flutter dependencies
      # ---------------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get

      # ---------------------------------------------------------
      # 3.5 Regenerate app icons (strip alpha channel for iOS)
      # ---------------------------------------------------------
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # ---------------------------------------------------------
      # 4. Install Apple Distribution certificate
      # ---------------------------------------------------------
      - name: Install Apple Distribution certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mataheko-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "temporary-password" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "temporary-password" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "temporary-password" \
            "$KEYCHAIN_PATH"

      # ---------------------------------------------------------
      # 5. Install provisioning profile
      # ---------------------------------------------------------
      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/Mataheko_App.mobileprovision"

          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/3d5df408-bff9-4cf9-adb1-fbe73967e16e.mobileprovision"

          echo "Provisioning profile installed."

      # ---------------------------------------------------------
      # 6. Verify signing assets
      # ---------------------------------------------------------
      - name: Verify Apple signing assets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Team ID: $APPLE_TEAM_ID"

          echo ""
          echo "Installed provisioning profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Installed certificates:"
          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/mataheko-signing.keychain-db" || true

      # ---------------------------------------------------------
      # 7. Verify Xcode project signing configuration
      # ---------------------------------------------------------
      - name: Verify Runner signing configuration
        run: |
          echo "Checking Runner project..."

          grep -n \
            -E \
            "CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER" \
            ios/Runner.xcodeproj/project.pbxproj || true

      # ---------------------------------------------------------
      # 8. Install CocoaPods dependencies
      # ---------------------------------------------------------
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install --repo-update

      # ---------------------------------------------------------
      # 9. Build signed IPA
      # ---------------------------------------------------------
      - name: Build signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist

      # ---------------------------------------------------------
      # 10. Show generated files
      # ---------------------------------------------------------
      - name: Show IPA files
        run: |
          echo "Generated IPA files:"
          find build/ios -name "*.ipa" -print

          echo ""
          echo "Generated archives:"
          find build/ios -name "*.xcarchive" -print

      # ---------------------------------------------------------
      # 11. Upload to App Store Connect
      # ---------------------------------------------------------
      - name: Upload to App Store Connect
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -e

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"

          printf '%s' "$APPSTORE_PRIVATE_KEY" \
            > "$API_KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)

          echo "Uploading $IPA_PATH to App Store Connect..."

          xcrun altool \
            --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

          echo "Upload completed successfully."

      # ---------------------------------------------------------
      # 12. Upload IPA artifact
      # ---------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mataheko-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      # ---------------------------------------------------------
      # 13. Upload XCArchive
      # ---------------------------------------------------------
      - name: Upload XCArchive
        uses: actions/upload-artifact@v4
        with:
          name: mataheko-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: warn
          retention-days: 7
