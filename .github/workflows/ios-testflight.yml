name: Mataheko iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Mataheko iOS
    runs-on: macos-15

    env:
      BUNDLE_ID: com.mataheko.community
      TEAM_ID: 7YZFL477VG
      PROFILE_NAME: Mataheko App
      PROFILE_UUID: 3d5df408-bff9-4cf9-adb1-fbe73967e16e

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SET UP FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          architecture: x64
          cache: true

      - name: Show Flutter and Xcode versions
        run: |
          flutter --version
          dart --version
          xcodebuild -version

      # ============================================================
      # 3. GET FLUTTER DEPENDENCIES
      # ============================================================
      - name: Get Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      # ============================================================
      # 4. INSTALL APPLE DISTRIBUTION CERTIFICATE
      # ============================================================
      - name: Install Apple Distribution certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="mataheko-build-keychain"

          echo "========================================"
          echo "CREATING TEMPORARY KEYCHAIN"
          echo "========================================"

          echo "$APPLE_CERTIFICATE_BASE64" \
            | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo ""
          echo "========================================"
          echo "IMPORTING APPLE DISTRIBUTION CERTIFICATE"
          echo "========================================"

          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -s "$KEYCHAIN_PATH"

          echo ""
          echo "Certificate installation completed."

      # ============================================================
      # 5. VERIFY APPLE DISTRIBUTION CERTIFICATE
      # ============================================================
      - name: Verify Apple Distribution certificate
        run: |
          set -e

          echo "========================================"
          echo "AVAILABLE CODE SIGNING IDENTITIES"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

          echo ""
          echo "========================================"
          echo "CHECKING APPLE DISTRIBUTION"
          echo "========================================"

          security find-identity \
            -v \
            -p codesigning \
            "$RUNNER_TEMP/build.keychain-db" \
            | grep "Apple Distribution"

          echo ""
          echo "Apple Distribution certificate found successfully."

      # ============================================================
      # 6. INSTALL PROVISIONING PROFILE
      # ============================================================
      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/Mataheko_App.mobileprovision"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_DEST="$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"

          echo "========================================"
          echo "DECODING PROVISIONING PROFILE"
          echo "========================================"

          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$PROFILE_DIR"

          echo ""
          echo "Installing provisioning profile..."

          cp "$PROFILE_PATH" "$PROFILE_DEST"

          echo ""
          echo "Installed:"
          ls -lh "$PROFILE_DEST"

      # ============================================================
      # 7. VERIFY PROVISIONING PROFILE
      # ============================================================
      - name: Verify provisioning profile
        run: |
          set -e

          PROFILE_PATH="$RUNNER_TEMP/Mataheko_App.mobileprovision"

          echo "========================================"
          echo "PROVISIONING PROFILE INFORMATION"
          echo "========================================"

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$RUNNER_TEMP/profile.plist"

          ACTUAL_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/profile.plist"
          )

          ACTUAL_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/profile.plist"
          )

          ACTUAL_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$RUNNER_TEMP/profile.plist"
          )

          ACTUAL_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/profile.plist"
          )

          echo ""
          echo "Profile Name:"
          echo "$ACTUAL_NAME"

          echo ""
          echo "Profile UUID:"
          echo "$ACTUAL_UUID"

          echo ""
          echo "Team Identifier:"
          echo "$ACTUAL_TEAM"

          echo ""
          echo "Application Identifier:"
          echo "$ACTUAL_APP_ID"

          echo ""
          echo "========================================"
          echo "VALIDATING PROFILE"
          echo "========================================"

          EXPECTED_APP_ID="${TEAM_ID}.${BUNDLE_ID}"

          if [ "$ACTUAL_NAME" != "$PROFILE_NAME" ]; then
            echo "ERROR: Provisioning profile name mismatch."
            echo "Expected: $PROFILE_NAME"
            echo "Actual:   $ACTUAL_NAME"
            exit 1
          fi

          if [ "$ACTUAL_UUID" != "$PROFILE_UUID" ]; then
            echo "ERROR: Provisioning profile UUID mismatch."
            echo "Expected: $PROFILE_UUID"
            echo "Actual:   $ACTUAL_UUID"
            exit 1
          fi

          if [ "$ACTUAL_TEAM" != "$TEAM_ID" ]; then
            echo "ERROR: Team ID mismatch."
            echo "Expected: $TEAM_ID"
            echo "Actual:   $ACTUAL_TEAM"
            exit 1
          fi

          if [ "$ACTUAL_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: Application identifier mismatch."
            echo "Expected: $EXPECTED_APP_ID"
            echo "Actual:   $ACTUAL_APP_ID"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PROFILE VALIDATION PASSED"
          echo "========================================"

      # ============================================================
      # 8. INSTALL COCOAPODS
      # ============================================================
      - name: Install CocoaPods
        run: |
          set -e
          cd ios
          pod install --repo-update

      # ============================================================
      # 9. BUILD FLUTTER IOS WITHOUT SIGNING
      # ============================================================
      - name: Build Flutter iOS without signing
        run: |
          set -e

          echo "========================================"
          echo "BUILDING FLUTTER IOS WITHOUT SIGNING"
          echo "========================================"

          flutter build ios \
            --release \
            --no-codesign

      # ============================================================
      # 10. ARCHIVE WITH EXPLICIT APP STORE SIGNING
      # ============================================================
      - name: Archive iOS app with Apple Distribution signing
        run: |
          set -e

          ARCHIVE_PATH="$RUNNER_TEMP/Mataheko.xcarchive"

          echo "========================================"
          echo "ARCHIVING MATAHEKO"
          echo "========================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

          echo ""
          echo "========================================"
          echo "ARCHIVE CREATED"
          echo "========================================"

          ls -lah "$ARCHIVE_PATH"

      # ============================================================
      # 11. CREATE EXPORT OPTIONS FOR APP STORE
      # ============================================================
      - name: Create App Store ExportOptions
        run: |
          set -e

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>

              <key>compileBitcode</key>
              <false/>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist created."

          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      # ============================================================
      # 12. EXPORT IPA
      # ============================================================
      - name: Export signed IPA
        run: |
          set -e

          ARCHIVE_PATH="$RUNNER_TEMP/Mataheko.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/export"

          mkdir -p "$EXPORT_PATH"

          echo "========================================"
          echo "EXPORTING SIGNED IPA"
          echo "========================================"

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo ""
          echo "========================================"
          echo "IPA EXPORT COMPLETED"
          echo "========================================"

          ls -lah "$EXPORT_PATH"

      # ============================================================
      # 13. COPY IPA AND ARCHIVE TO BUILD DIRECTORY
      # ============================================================
      - name: Prepare build artifacts
        run: |
          set -e

          mkdir -p build/ios/ipa
          mkdir -p build/ios/archive

          cp "$RUNNER_TEMP/export/"*.ipa \
            build/ios/ipa/

          cp -R "$RUNNER_TEMP/Mataheko.xcarchive" \
            build/ios/archive/Mataheko.xcarchive

          echo ""
          echo "========================================"
          echo "FINAL BUILD ARTIFACTS"
          echo "========================================"

          echo ""
          echo "IPA:"
          ls -lah build/ios/ipa/

          echo ""
          echo "XCARCHIVE:"
          ls -lah build/ios/archive/

      # ============================================================
      # 14. VERIFY IPA
      # ============================================================
      - name: Verify IPA
        run: |
          set -e

          IPA_COUNT=$(find build/ios/ipa -name "*.ipa" | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "ERROR: No IPA was created."
            exit 1
          fi

          echo "========================================"
          echo "IPA SUCCESSFULLY CREATED"
          echo "========================================"

          find build/ios/ipa \
            -name "*.ipa" \
            -print

      # ============================================================
      # 15. UPLOAD IPA
      # ============================================================
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mataheko-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 16. UPLOAD XCARCHIVE
      # ============================================================
      - name: Upload XCArchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: mataheko-ios-archive
          path: build/ios/archive/*.xcarchive
          if-no-files-found: error
          retention-days: 7

      # ============================================================
      # 17. CLEAN UP
      # ============================================================
      - name: Clean up signing assets
        if: ${{ always() }}
        run: |
          set +e

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "Cleaning up signing assets..."

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

          rm -f "$PROFILE_PATH"
          rm -f "$RUNNER_TEMP/apple_distribution.p12"
          rm -f "$RUNNER_TEMP/Mataheko_App.mobileprovision"
          rm -f "$RUNNER_TEMP/profile.plist"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"

          echo "Cleanup completed."
